<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4d3a"/>
      <stop offset="100%" stop-color="#0e2a20"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9ed85"/>
      <stop offset="100%" stop-color="#5fbf6f"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a7a5e"/>
      <stop offset="100%" stop-color="#163832"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Globe circle (represents world markets) -->
  <circle cx="32" cy="32" r="20" fill="url(#globeGrad)" stroke="#c9ed85" stroke-width="1.2" opacity="0.92"/>

  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="20" ry="7" fill="none" stroke="#c9ed85" stroke-width="0.9" opacity="0.55"/>
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="none" stroke="#c9ed85" stroke-width="0.7" opacity="0.4"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#c9ed85" stroke-width="0.9" opacity="0.55"/>

  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="7" ry="20" fill="none" stroke="#c9ed85" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="32" cy="32" rx="13" ry="20" fill="none" stroke="#c9ed85" stroke-width="0.7" opacity="0.4"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#c9ed85" stroke-width="0.9" opacity="0.55"/>

  <!-- Stylized "A" for Atlas (mountain peak + upward trend arrow) -->
  <path d="M 32 18 L 22 44 L 27 44 L 32 31 L 37 44 L 42 44 Z"
        fill="url(#accentGrad)"
        stroke="#0e2a20"
        stroke-width="0.6"
        stroke-linejoin="round"/>

  <!-- Crossbar of the A -->
  <rect x="28.5" y="38" width="7" height="2.2" rx="1" fill="url(#accentGrad)" stroke="#0e2a20" stroke-width="0.4"/>

  <!-- Ascending trend dots (represents growth/learning progression) -->
  <circle cx="18" cy="48" r="1.4" fill="#c9ed85" opacity="0.85"/>
  <circle cx="22" cy="46" r="1.4" fill="#c9ed85" opacity="0.85"/>
  <circle cx="42" cy="46" r="1.4" fill="#c9ed85" opacity="0.85"/>
  <circle cx="46" cy="48" r="1.4" fill="#c9ed85" opacity="0.85"/>
</svg>
